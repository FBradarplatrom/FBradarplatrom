<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#121916;--mut:#5d6661;--line:#e3e8e5;--brand:#118553;--brand-t:#0a7040;--on-brand:#fff;--soft:#dcefe4}
@media(prefers-color-scheme:dark){:root{--bg:#121916;--card:#1b221f;--ink:#e8efeb;--mut:#9aa6a0;--line:#2a332f;--brand:#35ac74;--brand-t:#6bc79a;--on-brand:#0d1a13;--soft:#1f3a2c}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:24px;max-width:560px;width:100%;padding:36px 28px;text-align:center;box-shadow:0 20px 60px -30px rgba(18,25,22,.35)}

.ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brand-t)}.ic svg{width:42px;height:42px;animation:sp 6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:0 0 8px;font-size:26px;line-height:1.35}p{margin:0 0 10px;color:var(--mut)}.msg{color:var(--ink);white-space:pre-line}.til{display:inline-block;background:var(--soft);color:var(--brand-t);border-radius:99px;padding:6px 16px;font-weight:700;margin:6px 0 16px}
.b{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:#25d366;color:#fff;border-radius:12px;padding:11px 22px;font-weight:700;text-decoration:none;margin-top:6px}
.lng{margin-top:20px;font-size:13px}.lng a{color:var(--mut);margin:0 6px}.small{font-size:13px;margin-top:14px}

(function(){var T={ar:{br:'رادار المنتجات الرابحة',h:'نُحسّن المنصة الآن',m:'نقوم بصيانة قصيرة لنقدّم لك منصة أسرع وأفضل. بياناتك ومنتجاتك محفوظة كما هي.',u:'نعود حوالي {t}',w:'تواصل معنا عبر واتساب',ok:'تتحدث الصفحة تلقائياً عند عودة المنصة.'},
