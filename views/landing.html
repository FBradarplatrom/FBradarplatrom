 document.querySelectorAll('[data-t]').forEach(function(el){var v=t[el.getAttribute('data-t')];if(v==null)return;if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v});
 document.querySelectorAll('[data-href]').forEach(function(a){a.href=a.getAttribute('data-href')+'?lang='+L});
 document.getElementById('lang').value=L;document.getElementById('lang-c').textContent={ar:'ع',en:'EN',fr:'FR'}[L];[].forEach.call(document.querySelectorAll('#lang-m [data-l]'),function(b){b.classList.toggle('on',b.dataset.l===L)});
 document.getElementById('feats').innerHTML=t.feats.map(function(f){return'<div class="c"><div class="ic">'+f[0]+'</div><h3>'+esc(f[1])+'</h3><p>'+esc(f[2])+'</p></div>'}).join('');
 document.getElementById('faqs').innerHTML=t.faqs.map(function(f){return'<details><summary>'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>'}).join('');
 document.getElementById('mk').innerHTML=MK.map(function(f){return'<span>'+f+'</span>'}).join('')+'<span>+ 20</span>';
 document.getElementById('yr').textContent=new Date().getFullYear();drawPlans()}
var PER=null,PSEL=0,HIDE=false;
function perName(m,t){return m===1?t.tab1:m===12?t.y12:t.mon.replace('{n}',m)}
function drawPlans(){var t=T[L],el=document.getElementById('plans');if(!PL)return;
 if(!PL.length){el.innerHTML='<div class="c" style="grid-column:1/-1;text-align:center"><p>'+esc(t.no_plans)+'</p></div>';return}
 var cur=function(n){return num(n)+' '+t.cur},lim=function(v){return+v<0?esc(L==='ar'?'بلا حد':L==='fr'?'illimité':'unlimited'):num(v)},paid=PL.filter(function(p){return!p.free&&p.periods&&p.periods.length}),free=PL.filter(function(p){return p.free})[0];
 var ms=(PER||[]).map(function(x){return+x.m}).filter(function(m){return paid.some(function(p){return p.periods.some(function(z){return z.m===m})})});
 if(!PSEL||ms.indexOf(PSEL)<0)PSEL=ms.indexOf(6)>=0?6:ms[0];
 var hot=paid.filter(function(p){return p.note})[0]||(paid.length>2?paid[1]:null);
 var tabs=ms.length>1?'<div class="ptabs" role="tablist">'+ms.map(function(m){var off=(PER.filter(function(x){return+x.m===m})[0]||{}).off;return'<button type="button" data-per="'+m+'" class="'+(m===PSEL?'on':'')+'">'+esc(perName(m,t))+(off?'<small><bdi dir="ltr">-'+off+'%</bdi></small>':'<small>&nbsp;</small>')+'</button>'}).join('')+'</div>':'';
 var fx=free?(FE||[]).filter(function(f){return(free.features||[]).indexOf(f.k)<0}).map(function(f){return f[L]||f.ar||f.en}):[];   // ما لم يُشمل في التجربة يُذكر بوضوح
 var trial=free?'<div class="ptrial"><div><b>'+esc(t.trial.replace('{d}',free.days))+'</b><br><span>'+esc(fx.length?t.trial_x.replace('{f}',fx.join(L==='ar'?'، ':', ')):t.trial_s)+'</span></div><a class="btn p" href="/register?lang='+L+'">'+esc(t.start_free)+'</a></div>':'';
 el.innerHTML='<div style="grid-column:1/-1">'+tabs+trial+'</div>'+paid.map(function(p){var nm=t.n&&t.n[p.name]||p.name,x=p.periods.filter(function(z){return z.m===PSEL})[0],Lm=p.limits||{};if(!x)return'';
  var pn=perName(x.m,t);
  return'<div class="plan'+(p===hot?' hot':'')+'">'+(p===hot?'<span class="tag ptag">'+esc((t.n&&t.n[p.note])||p.note||t.popular)+'</span>':'')+'<h3>'+esc(nm)+'</h3>'
  +'<div class="pcur"><span class="pr">'+num(x.monthly)+'</span><small>'+esc(t.pm)+'</small>'+(x.off?'<s>'+num(p.price)+'</s>':'')+'</div>'
  +'<div class="ptot">'+(x.m>1?'<b>'+esc(t.tot)+': '+cur(x.dzd)+'</b><br>'+esc(t.once.replace('{p}',pn))+(x.save?'<br><span class="sv">'+esc(t.save.replace('{a}',cur(x.save)).replace('{p}',pn))+'</span>':''):'<b>'+cur(x.dzd)+'</b><br>'+esc(t.once1))+(x.usd&&PM&&(PM.stripe||PM.paypal)?'<br><span class="us">'+esc(t.intl.replace('{u}','$'+x.usd.toFixed(2)))+'</span>':'')+'</div>'
  +'<ul><li>'+esc(t.core)+'</li>'+(+Lm.searchesPerDay===0?'':'<li>'+lim(Lm.searchesPerDay)+' '+esc(t.per_day)+'</li>')+(FE||[]).map(function(f){var k=f.k,on=(p.features||[]).indexOf(k)>=0,ex=k==='gap'?' · '+lim(Lm.gapProducts):k==='ai'?' · '+lim(Lm.aiPerMonth)+(+Lm.aiPerMonth<0?'':'/'+(L==='ar'?'شهر':L==='fr'?'mois':'mo')):k==='watch'?' · '+lim(Lm.watchPages):'';if(!on&&HIDE)return'';return'<li class="'+(on?'':'off')+'">'+esc(f[L]||f.ar||f.en||f.fr)+(on?ex:'')+'</li>'}).join('')+'</ul>'
  +'<a class="btn '+(p===hot?'p':'g')+'" href="/register?lang='+L+'">'+esc(t.start_free)+'</a></div>'}).join('');
 if(window.__rv)window.__rv();
 var m=[];if(PM){if(PM.baridi)m.push('BaridiMob','CCP',t.bank);if(PM.satim)m.push('CIB / Edahabia');if(PM.stripe)m.push('Visa / Mastercard');if(PM.paypal)m.push('PayPal')}
 var lst=m.length>1?m.slice(0,-1).join(t.sep)+t.or+m[m.length-1]:m[0];
 document.getElementById('pay').innerHTML=m.length?'<p class="pays">'+esc(t.pay_s).replace('{m}','<b>'+esc(lst)+'</b>')+'</p>':''}
(function(){var b=document.getElementById('lang-b'),m=document.getElementById('lang-m'),sel=document.getElementById('lang');
 b.addEventListener('click',function(){m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden))});
 m.addEventListener('click',function(e){var x=e.target.closest('[data-l]');if(!x)return;m.hidden=true;sel.value=x.dataset.l;sel.dispatchEvent(new Event('change'))});
 document.addEventListener('click',function(e){if(!e.target.closest('.lsel'))m.hidden=true});window.addEventListener('scroll',function(){m.hidden=true},{passive:true});document.addEventListener('keydown',function(e){if(e.key==='Escape')m.hidden=true})})();

if(q)put('wpr_lang',L);
render();
(function(){if(!('IntersectionObserver'in window))return;var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){var el=x.target;el.classList.add('in');io.unobserve(el);setTimeout(function(){el.classList.remove('rv','in');el.style.transitionDelay=''},1000)}})},{rootMargin:'0px 0px -8% 0px'});
 window.__rv=function(){document.querySelectorAll('section .sh, section .c, #plans .plan, .faq details, .band').forEach(function(el,i){if(el.dataset.rv)return;el.dataset.rv=1;el.classList.add('rv');el.style.transitionDelay=(i%3)*0.08+'s';io.observe(el)})};window.__rv()})();
document.getElementById('plans').addEventListener('click',function(e){var b=e.target.closest('[data-per]');if(!b)return;PSEL=+b.dataset.per;drawPlans()});
fetch('/api/plans/public').then(function(r){return r.json()}).then(function(j){PL=j.plans||[];PER=j.periods||[];PM=j.methods||{};FE=j.features||[];HIDE=j.missing==='hide';drawPlans()}).catch(function(){PL=[];drawPlans()});
})();
