<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إضافة جمع الإعلانات</title>
<style>
:root{--bg:#fff;--card:#f6f8fc;--line:#e3e8f3;--ink:#121916;--mut:#64748b;--brand:#118553;--ok:#059669;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#121916;--card:#131a30;--line:#25304f;--ink:#dbe1de;--mut:#93a0c0;--brand:#35ac74}}
*{box-sizing:border-box}body{margin:0;width:360px;background:var(--bg);color:var(--ink);font:14px/1.6 Tahoma,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}header img{width:26px;height:26px;border-radius:7px}header b{flex:1;font-size:15px}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
main{padding:12px 14px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
h2{margin:0 0 6px;font-size:15px}.mut{color:var(--mut);font-size:13px}.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.big div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 2px}.big b{display:block;font-size:20px;line-height:1.2}.big span{font-size:11.5px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#118553,#35ac74);transition:width .3s}
ul{list-style:none;margin:8px 0 0;padding:0;max-height:140px;overflow:auto}li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}li:last-child{border:0}li .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li small{color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{padding:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn{flex:1;min-width:110px;border:0;border-radius:10px;padding:9px 10px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
footer{padding:8px 14px 12px;color:var(--mut);font-size:11.5px;text-align:center}
</style></head><body>
<header><img src="icons/icon48.png" alt=""><b data-t="إضافة جمع الإعلانات">إضافة جمع الإعلانات</b><span id="conn" class="pill">…</span></header>
<main>
  <section class="card" id="status"></section>
  <section class="card">
    <h2 data-t="الإرسال إلى المنصة">الإرسال إلى المنصة</h2>
    <div class="seg"><button id="m-auto" data-mode="auto" data-t="تلقائي">تلقائي</button><button id="m-manual" data-mode="manual" data-t="يدوي">يدوي</button></div>
    <p class="mut" id="mode-hint" style="margin:8px 0"></p>
    <div class="row"><button class="btn" id="send" data-t="إرسال الآن">إرسال الآن</button><button class="btn ghost" id="discard" hidden data-t="مسح غير المرسل">مسح غير المرسل</button></div>
  </section>
  <div class="row" id="actions"></div>
</main>
<footer id="ver"></footer>
<script src="popup.js"></script></body></html>
